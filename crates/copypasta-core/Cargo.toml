[package]
name = "copypasta-core"
version = "0.3.2"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "jpeg", "gif", "bmp", "webp"] }
once_cell = "1.21.4"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
